name: ingest

on:
  schedule:
    # 只在週一～五、UTC 12:00–22:59 每 5 分鐘跑（涵蓋夏/冬令的美股盤前～盤後）。
    # 程式內 marketActiveET() 還會再精準收到 ET 08:00–17:00，省 Gemini 用量。
    - cron: "*/5 12-22 * * 1-5"
  workflow_dispatch: {} # 手動觸發會略過時段檢查，強制跑一次

# 避免兩次排程重疊
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write # 需要寫權限才能 commit 回 data/

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run ingest
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 公開 repo：把真實持倉放這個 secret（整包 JSON），就不用提交到版控
          POSITIONS_JSON: ${{ secrets.POSITIONS_JSON }}
        run: npm run ingest

      - name: Commit data
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "沒有資料變動，略過 commit"
          else
            git commit -m "data: update snapshot [skip ci]"
            git push
          fi
