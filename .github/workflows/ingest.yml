name: ingest

on:
  schedule:
    - cron: "*/5 * * * *" # 每 5 分鐘（GitHub 在高負載時可能延遲數分鐘，屬正常）
  workflow_dispatch: {} # 也能在 Actions 頁面手動觸發

# 避免兩次排程重疊
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write # 需要寫權限才能 commit 回 data/

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run ingest
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 公開 repo：把真實持倉放這個 secret（整包 JSON），就不用提交到版控
          POSITIONS_JSON: ${{ secrets.POSITIONS_JSON }}
        run: npm run ingest

      - name: Commit data
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "沒有資料變動，略過 commit"
          else
            git commit -m "data: update snapshot [skip ci]"
            git push
          fi
